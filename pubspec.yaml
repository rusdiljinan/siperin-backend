name: inventaris_instansi
description: Aplikasi inventaris barang instansi pemerintah - hybrid Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  fl_chart: ^1.2.0
  image_picker: ^1.1.2
  intl: ^0.20.3
  shimmer: ^4.0.0
  go_router: ^18.1.4
  file_saver: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
